<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特种设备安全码</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen">
  <div class="mp-page">
    <iframe id="bg" src="index.html" title="主界面"></iframe>
    <div class="mp-mask" onclick="location.href='index.html'"></div>
    <div class="mp-dialog" style="top:47%">
      <svg id="mp" viewBox="0 0 200 200"></svg>
      <div class="mp-tip">长按上方图片，选择“识别图中二维码”进入小程序</div>
    </div>
  </div>
</div>

<script>
// 小程序码风格装饰图案（确定性伪随机，非真实小程序码）——黑色码点 + 红色院徽中心
(function(){
  var svg=document.getElementById('mp'), dot='#1a1a1a', seal='#c2372b';
  function h(x,y,k){var s=Math.sin((x+1)*127.1+(y+1)*311.7+(k||0)*74.7)*43758.5453;return s-Math.floor(s);}
  var r='';
  for(var i=0;i<430;i++){
    var a=h(i,7)*Math.PI*2, rr=36+h(i,13)*56;
    var x=100+Math.cos(a)*rr, y=100+Math.sin(a)*rr;
    var d=1.2+h(i,23)*2.2;
    if(h(i,31)>0.45) r+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+d.toFixed(1)+'" fill="'+dot+'"/>';
  }
  // 六个定位眼
  [-135,-45,185,-5,135,45].forEach(function(deg){
    var a=deg*Math.PI/180, ex=100+Math.cos(a)*86, ey=100+Math.sin(a)*86;
    r+='<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="6.5" fill="none" stroke="'+dot+'" stroke-width="2.4"/>';
    r+='<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="2.2" fill="'+dot+'"/>';
  });
  // 红色院徽：双环 + 竖琴 + 环内文字点
  r+='<circle cx="100" cy="100" r="30" fill="#fff"/>';
  r+='<circle cx="100" cy="100" r="30" fill="none" stroke="'+seal+'" stroke-width="2.8"/>';
  r+='<circle cx="100" cy="100" r="25.5" fill="none" stroke="'+seal+'" stroke-width="1"/>';
  for(var t=0;t<9;t++){
    var ta=(-125+t*9)*Math.PI/180;
    r+='<circle cx="'+(100+Math.cos(ta)*27.7).toFixed(1)+'" cy="'+(100+Math.sin(ta)*27.7).toFixed(1)+'" r="0.9" fill="'+seal+'"/>';
  }
  r+='<g transform="translate(100,100)">';
  r+='<path d="M-11,10 C-14,-2 -9,-11 0,-13 C9,-11 14,-2 11,10" fill="none" stroke="'+seal+'" stroke-width="2.6" stroke-linecap="round"/>';
  r+='<path d="M-6,-7 L-6,7 M0,-9 L0,8 M6,-7 L6,7" stroke="'+seal+'" stroke-width="1.4"/>';
  r+='<path d="M-13,12 L13,12" stroke="'+seal+'" stroke-width="2.4" stroke-linecap="round"/>';
  r+='</g>';
  // 微信小程序角标
  r+='<g transform="translate(146,146)"><circle r="14" fill="#3ebc00"/><text x="0" y="5.5" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" font-family="Arial">S</text></g>';
  svg.innerHTML=r;
})();
// 隐藏弹窗背后主界面的滚动条（保持可滚动）
document.getElementById('bg').addEventListener('load',function(){
  try{
    var d=this.contentDocument;
    var st=d.createElement('style');
    st.textContent='::-webkit-scrollbar{display:none}html{scrollbar-width:none}';
    d.head.appendChild(st);
  }catch(e){}
});
</script>

</body>
</html>
