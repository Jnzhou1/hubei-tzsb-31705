<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特种设备安全码</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="screen">
  <div class="mp-page">
    <iframe id="bg" src="index.html" title="主界面"></iframe>
    <div class="mp-mask" onclick="location.href='index.html'"></div>
    <div class="mp-dialog" style="top:50%">
      <svg id="mp" viewBox="0 0 200 200"></svg>
      <div class="mp-tip">长按上方图片，选择“识别图中二维码”进入小程序</div>
    </div>
  </div>
</div>

<script>
// 小程序码风格装饰图案（确定性伪随机，非真实小程序码）——蓝色码点 + 盾形徽标 + 外圈细环
(function(){
  var svg=document.getElementById('mp'), dot='#2e6fd0', ring='#8fb9ec';
  function h(x,y,k){var s=Math.sin((x+3)*127.1+(y+5)*311.7+(k||0)*74.7)*43758.5453;return s-Math.floor(s);}
  var r='';
  // 外圈浅蓝细环
  r+='<circle cx="100" cy="100" r="93" fill="none" stroke="'+ring+'" stroke-width="2"/>';
  for(var i=0;i<430;i++){
    var a=h(i,7)*Math.PI*2, rr=36+h(i,13)*54;
    var x=100+Math.cos(a)*rr, y=100+Math.sin(a)*rr;
    var d=1.2+h(i,23)*2.2;
    if(h(i,31)>0.45) r+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+d.toFixed(1)+'" fill="'+dot+'"/>';
  }
  // 六个定位眼
  [-135,-45,185,-5,135,45].forEach(function(deg){
    var a=deg*Math.PI/180, ex=100+Math.cos(a)*84, ey=100+Math.sin(a)*84;
    r+='<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="6.5" fill="none" stroke="'+dot+'" stroke-width="2.4"/>';
    r+='<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="2.2" fill="'+dot+'"/>';
  });
  // 中心蓝色盾形徽标：白楼 + 金色弧
  r+='<g transform="translate(100,100)">';
  r+='<path d="M-21,-17 C-11,-21 11,-21 21,-17 L21,4 C21,16 9,24 0,28 C-9,24 -21,16 -21,4 Z" fill="'+dot+'"/>';
  r+='<rect x="-13" y="-3" width="7" height="14" fill="#fff"/>';
  r+='<rect x="-4" y="-9" width="8" height="20" fill="#fff"/>';
  r+='<rect x="6" y="-1" width="6" height="12" fill="#fff"/>';
  r+='<path d="M-15,7 C-5,13 9,13 15,5 C11,15 -9,16 -15,7 Z" fill="#f4c855"/>';
  r+='</g>';
  // 微信小程序角标
  r+='<g transform="translate(146,146)"><circle r="14" fill="#3ebc00"/><text x="0" y="5.5" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" font-family="Arial">S</text></g>';
  svg.innerHTML=r;
})();
// 隐藏弹窗背后主界面的滚动条（保持可滚动），并滚动到企业应用/检验应用位置
document.getElementById('bg').addEventListener('load',function(){
  try{
    var d=this.contentDocument;
    var st=d.createElement('style');
    st.textContent='::-webkit-scrollbar{display:none}html{scrollbar-width:none}';
    d.head.appendChild(st);
    setTimeout(function(){ this.contentWindow.scrollTo(0,470); }.bind(this),60);
  }catch(e){}
});
</script>

</body>
</html>
