<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="i-angle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-user-o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.2" r="3.6"/><path d="M4.8,20 C6,15.8 8.8,14 12,14 C15.2,14 18,15.8 19.2,20"/></symbol>
  <symbol id="i-lock-o" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="1.5"/><path d="M8.2,10.5 V8 a3.8,3.8 0 0 1 7.6,0 v2.5"/></symbol>
</defs></svg>

<div class="screen">
  <div class="subhead">
    <a class="back" href="index.html"><svg width="22" height="22"><use href="#i-angle"/></svg></a>
    <span class="st">登录</span>
  </div>

  <div class="login-body">
    <div class="login-logo">
      <svg width="272" height="66" viewBox="0 0 300 72">
        <path d="M8,50 C26,14 96,0 178,6 C104,2 40,16 16,54 Z" fill="#2b9fd6"/>
        <text x="30" y="60" font-size="34" font-weight="800" font-style="italic" fill="#3f4a56" font-family="Arial, sans-serif">HBSEI</text>
        <text x="158" y="59" font-size="30" font-weight="700" fill="#3f4a56">湖北特检</text>
      </svg>
    </div>

    <div class="lfield"><svg><use href="#i-user-o"/></svg><input type="text" placeholder="请输入用户名"></div>
    <div class="lfield"><svg><use href="#i-lock-o"/></svg><input type="password" placeholder="请输入密码"></div>

    <label class="lremember"><input type="checkbox">记住密码</label>

    <button class="lbtn">登 录</button>

    <div class="llinks">
      <a href="javascript:;">注册账户</a>
      <a href="javascript:;">忘记密码</a>
      <a href="javascript:;">修改密码</a>
    </div>
  </div>
</div>

</body>
</html>
